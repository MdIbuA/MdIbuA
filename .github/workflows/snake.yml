name: Generate Snake Animation & Activity Graph

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Self-hosted replacement for the github-readme-activity-graph service.
      # Must run in this job (the deploy replaces the whole output branch) and before
      # snk, whose container creates dist/ as root.
      - uses: actions/checkout@v5
        with:
          path: repo
          sparse-checkout: .github/scripts

      - name: Generate activity graph
        run: python3 repo/.github/scripts/activity_graph.py MdIbuA dist/activity-graph.svg 31
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: MdIbuA
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
